<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f43f5e" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg1)" />

  <!-- Clean Grid Dots -->
  <g fill="#f43f5e" opacity="0.10">
    <circle cx="60" cy="60" r="4" />
    <circle cx="120" cy="60" r="4" />
    <circle cx="180" cy="60" r="4" />
    <circle cx="60" cy="120" r="4" />
    <circle cx="120" cy="120" r="4" />
    <circle cx="1180" cy="620" r="5" />
    <circle cx="1220" cy="620" r="5" />
    <circle cx="1200" cy="660" r="5" />
  </g>

  <!-- Main Technical Window -->
  <g filter="url(#shadow)">
    <rect x="100" y="90" width="1080" height="540" rx="32" fill="#ffffff" stroke="#fecdd3" stroke-width="2" />
    <rect x="100" y="90" width="1080" height="64" rx="32" fill="#fff1f2" />
    <!-- Window controls -->
    <circle cx="145" cy="122" r="8" fill="#fb7185" />
    <circle cx="170" cy="122" r="8" fill="#fbbf24" />
    <circle cx="195" cy="122" r="8" fill="#34d399" />
    <text x="640" y="128" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="14" fill="#e11d48" text-anchor="middle" letter-spacing="1.5">0xSEC // TECHNICAL LOGS &bull; EPISODE 01</text>
  </g>

  <!-- Episode Badge -->
  <rect x="160" y="195" width="190" height="44" rx="22" fill="#f43f5e" />
  <text x="255" y="223" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="15" fill="#ffffff" text-anchor="middle" letter-spacing="1">EPISODE 01</text>

  <!-- Category Tag -->
  <rect x="365" y="195" width="200" height="44" rx="22" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" />
  <text x="465" y="223" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="14" fill="#e11d48" text-anchor="middle" letter-spacing="0.5">DAY 1 OF 100</text>

  <!-- Main Headline -->
  <text x="160" y="325" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="56" fill="#0f172a" letter-spacing="-1">
    Why I'm Starting
  </text>
  <text x="160" y="395" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="56" fill="#e11d48" letter-spacing="-1">
    Cybersecurity In Public
  </text>

  <!-- Subtitle -->
  <text x="160" y="460" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="22" fill="#64748b">
    The 100-Day Roadmap &bull; Feynman Technique &bull; Zero to Security Analyst
  </text>

  <!-- Spec Badges -->
  <rect x="160" y="515" width="210" height="38" rx="19" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="265" y="539" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="13" fill="#16a34a" text-anchor="middle" letter-spacing="0.5">ETHICAL LABS ONLY</text>

  <rect x="385" y="515" width="230" height="38" rx="19" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" />
  <text x="500" y="539" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="13" fill="#9333ea" text-anchor="middle" letter-spacing="0.5">TARGET: OSCP &amp; SEC+</text>

  <!-- Right Side Visual: Geometric Shield Crest -->
  <g transform="translate(940, 260)">
    <circle cx="80" cy="80" r="100" fill="#fff1f2" stroke="#fecdd3" stroke-width="3" />
    <!-- Shield icon -->
    <path d="M80 30 L130 50 V95 C130 128 108 152 80 162 C52 152 30 128 30 95 V50 Z" fill="none" stroke="#e11d48" stroke-width="6" stroke-linejoin="round" />
    <path d="M80 48 L114 62 V94 C114 117 99 135 80 144 C61 135 46 117 46 94 V62 Z" fill="#ffe4e6" opacity="0.6" />
    <circle cx="80" cy="95" r="12" fill="#e11d48" />
  </g>
</svg>
