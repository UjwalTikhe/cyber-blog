  </text>

  <!-- Subtitle -->
  <text x="160" y="460" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="22" fill="#64748b">
    First Principles &bull; Feynman Method &bull; Verifiable Security Telemetry
  </text>

  <!-- Spec Badges -->
  <rect x="160" y="515" width="200" height="36" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="260" y="538" font-family="JetBrains Mono, monospace" font-weight="700" font-size="12" fill="#16a34a" text-anchor="middle">VERIFIED SIMULATION</text>

  <rect x="375" y="515" width="220" height="36" rx="18" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" />
  <text x="485" y="538" font-family="JetBrains Mono, monospace" font-weight="700" font-size="12" fill="#9333ea" text-anchor="middle">511 DOSSIER SERIES</text>

  <!-- Right Side Visual: Geometric Shield Crest -->
  <g transform="translate(940, 260)">
    <circle cx="80" cy="80" r="100" fill="#fff1f2" stroke="#fecdd3" stroke-width="2.5" />
    <path d="M80 30 L130 50 V95 C130 128 108 152 80 162 C52 152 30 128 30 95 V50 Z" fill="none" stroke="#e11d48" stroke-width="5" stroke-linejoin="round" />
    <path d="M80 48 L114 62 V94 C114 117 99 135 80 144 C61 135 46 117 46 94 V62 Z" fill="#ffe4e6" opacity="0.6" />
    <text x="80" y="103" font-family="JetBrains Mono, monospace" font-weight="bold" font-size="20" fill="#e11d48" text-anchor="middle">511</text>
  </g>
