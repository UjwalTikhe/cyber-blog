<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f43f5e" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg1)" />

  <!-- Clean Grid Dots -->
  <g fill="#f43f5e" opacity="0.08">
    <circle cx="60" cy="60" r="3.5" />
    <circle cx="120" cy="60" r="3.5" />
    <circle cx="180" cy="60" r="3.5" />
    <circle cx="60" cy="120" r="3.5" />
    <circle cx="120" cy="120" r="3.5" />
    <circle cx="1180" cy="620" r="4" />
    <circle cx="1220" cy="620" r="4" />
    <circle cx="1200" cy="660" r="4" />
  </g>

  <!-- Technical Window Frame -->
  <g filter="url(#shadow)">
    <rect x="100" y="90" width="1080" height="540" rx="32" fill="#ffffff" stroke="#fecdd3" stroke-width="2" />
    <rect x="100" y="90" width="1080" height="64" rx="32" fill="#fff1f2" />
    <!-- Window controls -->
    <circle cx="145" cy="122" r="7" fill="#fb7185" />
    <circle cx="168" cy="122" r="7" fill="#fbbf24" />
    <circle cx="191" cy="122" r="7" fill="#34d399" />
    <text x="640" y="128" font-family="JetBrains Mono, monospace" font-weight="700" font-size="13" fill="#e11d48" text-anchor="middle" letter-spacing="2">AKTE 511 // DOSSIER RECORD &bull; AKTE #001</text>
  </g>

  <!-- Akte Badge -->
  <rect x="160" y="195" width="160" height="42" rx="21" fill="#f43f5e" />
  <text x="240" y="222" font-family="JetBrains Mono, monospace" font-weight="800" font-size="15" fill="#ffffff" text-anchor="middle" letter-spacing="1">AKTE 001</text>

  <!-- Discipline Tag -->
  <rect x="335" y="195" width="220" height="42" rx="21" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" />
  <text x="445" y="222" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="14" fill="#e11d48" text-anchor="middle" letter-spacing="0.5">CORE PHILOSOPHY</text>

  <!-- Main Headline -->
  <text x="160" y="325" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="56" fill="#0f172a" letter-spacing="-1">
    The Philosophy of
  </text>
  <text x="160" y="395" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="56" fill="#e11d48" letter-spacing="-1">
