<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="50%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#fff1f2" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg3)" />

  <g filter="url(#shadow3)">
    <rect x="100" y="90" width="1080" height="540" rx="32" fill="#ffffff" stroke="#bae6fd" stroke-width="2" />
    <rect x="100" y="90" width="1080" height="64" rx="32" fill="#f0f9ff" />
    <circle cx="145" cy="122" r="8" fill="#fb7185" />
    <circle cx="170" cy="122" r="8" fill="#fbbf24" />
    <circle cx="195" cy="122" r="8" fill="#34d399" />
    <text x="640" y="128" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="14" fill="#0284c7" text-anchor="middle" letter-spacing="1.5">0xSEC // PACKET FORENSICS &bull; EPISODE 03</text>
  </g>

  <rect x="160" y="195" width="190" height="44" rx="22" fill="#0284c7" />
  <text x="255" y="223" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="15" fill="#ffffff" text-anchor="middle" letter-spacing="1">EPISODE 03</text>

  <rect x="365" y="195" width="240" height="44" rx="22" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
  <text x="485" y="223" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="14" fill="#0284c7" text-anchor="middle" letter-spacing="0.5">TCP/IP &amp; NMAP INTERNALS</text>

  <text x="160" y="325" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="56" fill="#0f172a" letter-spacing="-1">
    TCP 3-Way Handshake
  </text>
  <text x="160" y="395" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="56" fill="#0284c7" letter-spacing="-1">
    &amp; Stealth Port Scans
  </text>

  <text x="160" y="460" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="22" fill="#64748b">
    SYN vs Connect Scans &bull; Wireshark Packets &bull; Snort IDS Detection
  </text>

  <rect x="160" y="515" width="240" height="38" rx="19" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="280" y="539" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="13" fill="#16a34a" text-anchor="middle" letter-spacing="0.5">SYN &rarr; SYN-ACK &rarr; ACK</text>

  <rect x="415" y="515" width="220" height="38" rx="19" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" />
  <text x="525" y="539" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="13" fill="#9333ea" text-anchor="middle" letter-spacing="0.5">SURICATA / SNORT IDS</text>

  <!-- Right Side Visual: Network Node Mesh Graphic -->
  <g transform="translate(940, 260)">
    <circle cx="80" cy="80" r="100" fill="#f0f9ff" stroke="#bae6fd" stroke-width="3" />
    <!-- Node mesh -->
    <line x1="45" y1="50" x2="115" y2="50" stroke="#38bdf8" stroke-width="2" />
    <line x1="45" y1="50" x2="80" y2="115" stroke="#38bdf8" stroke-width="2" />
    <line x1="115" y1="50" x2="80" y2="115" stroke="#38bdf8" stroke-width="2" />
    <circle cx="45" cy="50" r="12" fill="#0284c7" />
    <circle cx="115" cy="50" r="12" fill="#0284c7" />
    <circle cx="80" cy="115" r="14" fill="#0369a1" />
  </g>
</svg>
